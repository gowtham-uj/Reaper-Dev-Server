services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    user: "0:0"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VPS_PROJECTS: /workspace
      GLOBAL_ENV: /global-env/global-env.json
      STATE_DIR: /app/backend/.reaper-local
      CLAUDE_SKILLS_STORE: /workspace/cloud_proxy/.cloud-proxy/skills-store
      REAPER_PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in app/.env}
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APEX_DOMAIN: ${APEX_DOMAIN:-}
      REAPER_HOST: ${REAPER_HOST:?Set REAPER_HOST in app/.env}
      HOST_PROJECTS_ROOT: /app/workspace
      REAPER_POD_IMAGE: reaper-pod:latest
      CADDY_CONTAINER: reaper-caddy
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-268435456}
      UPLOAD_STORAGE_RESERVE_BYTES: ${UPLOAD_STORAGE_RESERVE_BYTES:-1073741824}
      UPLOAD_REQUEST_TIMEOUT_MS: ${UPLOAD_REQUEST_TIMEOUT_MS:-1800000}
    volumes:
      - ./workspace:/workspace
      - ./global-env:/global-env
      - ./backend-state:/app/backend/.reaper-local
      - ./terminal-home/root:/root
      - ./opencode/data:/root/.local/share/opencode
      - ./opencode/config:/root/.config/opencode
      - ./opencode/cache:/root/.cache/opencode
      - /var/run/docker.sock:/var/run/docker.sock
      - ./caddy-dynamic:/caddy-dynamic
    ports:
      - "127.0.0.1:4000:4000"
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/ready',{timeout:3000},r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s


  caddy:
    image: caddy:2.10.2-alpine
    container_name: reaper-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      REAPER_HOST: ${REAPER_HOST:?Set REAPER_HOST in app/.env}
    depends_on:
      - backend
    volumes:
      - ./https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
      - ./frontend-v2/dist:/srv/reaper/dist:ro
      - ./caddy-dynamic:/caddy-dynamic:ro
